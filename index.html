<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Mestre IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="card-personagem">
            <h2>Ficha de Herói</h2>

            <div class="status-item">
                <label for="charId">ID do Personagem:</label>
                <input type="number" id="charId" value="1">
            </div>

            <hr class="divisor">

            <div class="status-item">
                <span>Status de Conexão:</span>
                <strong id="statusText" class="status-online">Pronto</strong>
            </div>
        </aside>

        <main class="painel-jogo">
            <div class="terminal" id="terminal">
                <div class="mensagem mensagem-ia">
                    > O Mestre aguarda suas ordens. Digite sua ação abaixo para iniciar
                </div>
            </div>

            <div class="controles">
                <input type="text" id="campoAcao" placeholder="Investigo o báu antigo no canto da sala..." onkeydown="checarEnter(event)">
                <button id="btnEnviar" onclick="sendAction()">Enviar Ação</button>
            </div>
        </main>
    </div>

    <script>
        async function sendAction(){
            const inputAction = document.getElementById("campoAcao");
            const terminal = document.getElementById("terminal");
            const statusText = document.getElementById("statusText");
            const btnSend = document.getElementById("btnEnviar");
            const characterId = document.getElementById("charId").value;

            const action = inputAction.value.trim();

            if(!action){
                alert("Digite algo antes de enviar!");
                return;
            }

            terminal.innerHTML += `<div class="mensagem mensagem-jogdor">> ${action}</div>`;
            inputAction.value = " ";

            terminal.scrollTop = terminal.scrollHeight;

            statusText.innerText = "Mestre pensando...";
            statusText.className = "status-pensando";
            btnSend.disabled = true;

            try{
                const actionDTO = {
                    id: parseInt(characterId),
                    actionPlayer: action
                }

                const response = await fetch(`http://localhost:8080/characters/play`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(actionDTO)
                });

                if(!response.ok){
                    throw new Error("Erro no backend: " + response.status);
                }

                const narrative = await response.text();

                terminal.innerHTML += `<div class="mensagem mensagem-ia">${narrative}</div>`;
            } catch (erro){
                console.error("Erro na comunicação: ", erro);
                terminal.innerHTML += `<div class="mensagem mensagem-erro">[ERRO]: Não foi possível conectar ao Mestre. Verifique o Spring Boot. </div>`;
            } finally {
                statusText.innerText = "Pronto";
                statusText.className = "status-online";
                btnSend.disabled = false;
                terminal.scrollTop = terminal.scrollHeight
            }
        }

        function checarEnter(event){
            if (event.key === 'Enter') {
                sendAction();
            }
        }
    </script>
</body>
</html>

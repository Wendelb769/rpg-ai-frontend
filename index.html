<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Mestre IA</title>
</head>
<body>
    <h1>Mestre de RPG</h1>

    <input type="text", id="actionPlayer", placeholder="O que você faz?">

    <button onclick="sendAction()">Enviar</button>

    <div id="responseMaster"></div>

    <script>
        async function sendAction(){
            const inputAction = document.getElementById("actionPlayer");
            const divResponse = document.getElementById("responseMaster");

            const action = inputAction.value.trim();

            if(!action){
                alert("Digite algo antes de enviar!");
                return;
            }

            divResponse.innerText = "O Mestre está pensando...";

            try{
                const actionDTO = {
                    id: 1,
                    actionPlayer: action
                }

                const response = await fetch(`http://localhost:8080/characters/play`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(actionDTO)
                });

                if(!response.ok){
                    throw new Error("Erro no backend: " + response.status);
                }

                const narrative = await response.text();

                divResponse.innerText = narrative;

                inputAction.value = '';
            } catch (erro){
                console.error("Erro na comunicação: ", erro);
                divResponse.innerText = "Erro ao se comunicar com o Mestre";
            }

        }
    </script>
</body>
</html>
